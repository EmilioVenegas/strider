[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "strider-dna"
dynamic = ["version"]
description = "Nucleic acid thermodynamics, TMSD kinetics, and sequence design — the biophysics layer below mantis-delta"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Venegas", email = "emiliovenegas10@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
vienna   = ["ViennaRNA>=2.6"]
parallel = ["joblib>=1.3"]
pandas   = ["pandas>=2.0"]
mantis   = ["mantis-delta>=0.1"]
diff     = ["torch>=2.0"]   # gradient-based differentiable design (DifferentiableDesigner / DiffObjective)
viz      = ["matplotlib>=3.6"]   # plotting (matplotlib is also a core dep; pinned here for discoverability)
full     = ["ViennaRNA>=2.6", "joblib>=1.3", "pandas>=2.0", "mantis-delta>=0.1", "torch>=2.0", "matplotlib>=3.6"]
dev      = ["pytest>=7.0", "pytest-cov", "ruff", "mypy", "pytest-mpl>=0.16"]

[project.urls]
Homepage   = "https://github.com/EmilioVenegas/strider"
Repository = "https://github.com/EmilioVenegas/strider"
Issues     = "https://github.com/EmilioVenegas/strider/issues"

[project.scripts]
strider = "strider.cli:main"

[tool.setuptools.packages.find]
include = ["strider*"]

[tool.setuptools_scm]
# Version is derived from git tags (vX.Y.Z). Between tags, builds get a
# PEP 440 dev version (e.g. 0.2.1.devN+g<hash>). No manual version bumps.

# Optional Rust accelerator `strider._native` (see native/ and README section
# "Native acceleration").  optional=True: if a Rust toolchain is unavailable
# at build time (sdist consumer, CI without cargo), the build continues
# without it and strider falls back to the pure-Python implementations
# (bit-compatible, see tests/test_native_parity.py).
# NOTE: setuptools-rust reads [[tool.setuptools-rust.ext-modules]] — the plain
# `extensions` list form is silently ignored (empty dist.rust_extensions).
[[tool.setuptools-rust.ext-modules]]
target = "strider._native"
path = "native/Cargo.toml"
binding = "PyO3"
optional = true
py-limited-api = "auto"  # abi3 (pyo3 abi3-py38 feature): one wheel covers cp38+

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests skipped by default; run with `pytest -m slow`",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
# Figure scripts in paper/figures/ do a bare `import _style` which works at
# runtime (Python adds the script directory to sys.path), but Pylance only
# searches from the project root.  Adding the figures directory here silences
# the false-positive "Cannot find module '_style'" error.
extraPaths = ["paper/figures"]
