site_name: strider-dna
site_url: https://emiliovenegas.github.io/strider
repo_url: https://github.com/EmilioVenegas/strider
repo_name: EmilioVenegas/strider

theme:
  name: material
  palette:
    primary: teal
    accent: cyan
  features:
    - navigation.sections
    - navigation.top

# The docs home page includes the canonical README verbatim (see docs/index.md),
# so the repo README is the single source of truth — no hand-maintained duplicate.
markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - Known limitations: limitations.md
  - API Reference: api.md
