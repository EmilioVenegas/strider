name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  wheels:
    name: Native abi3 wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history + tags
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build abi3 wheel (strider._native inside)
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp38-abi3"
          CIBW_SKIP: "*-musllinux*"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: wheels
    environment:
      name: pypi
      url: https://pypi.org/p/strider-dna  # PyPI package name
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history + tags to derive the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pypa/build
        run: python -m pip install build --user

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Download native wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
